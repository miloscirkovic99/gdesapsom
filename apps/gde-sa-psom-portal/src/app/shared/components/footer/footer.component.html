<footer class="bg-base-200 border-t border-base-300 mt-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-6">
      <a routerLink="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
        <img
          src="assets/logo-small.png"
          class="h-16 w-16 rounded-full object-cover"
          alt="Gde sa psom"
          loading="lazy"
        />
        <span class="font-display text-xl font-bold text-base-content">Gde sa psom</span>
      </a>

      <ul class="flex flex-wrap items-center justify-center gap-4 sm:gap-6 text-sm font-medium text-base-content/70">
        <li>
          <a [routerLink]="routeConstants.about" class="hover:text-secondary transition-colors">
            {{ 'about' | transloco }}
          </a>
        </li>
        <li>
          <a [routerLink]="routeConstants.cookiesPolicy" class="hover:text-secondary transition-colors">
            {{ 'cookie_header' | transloco }}
          </a>
        </li>
        <li>
          <a [routerLink]="routeConstants.allSpots" class="hover:text-secondary transition-colors">
            {{ 'find_pet_spots' | transloco }}
          </a>
        </li>
        <li>
          <a [routerLink]="routeConstants.petParks" class="hover:text-secondary transition-colors">
            {{ 'find_pet_parks' | transloco }}
          </a>
        </li>
      </ul>
    </div>

    <div class="divider my-4"></div>

    <div class="flex flex-col sm:flex-row items-center justify-between gap-2 text-sm text-base-content/50">
      <span>
        Designed & Developed by
        <a
          class="link link-hover text-secondary"
          referrerpolicy="no-referrer"
          href="https://www.linkedin.com/in/milos-cirkovic99/"
          target="_blank"
          rel="noopener noreferrer"
        >Miloš Ćirković</a>
      </span>
      <span>© 2021–{{ date }} gdesapsom.com. All Rights Reserved.</span>
    </div>
  </div>
</footer>
