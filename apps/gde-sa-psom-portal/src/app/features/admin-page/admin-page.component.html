<div class="admin-layout flex h-[calc(100vh-56px)] sm:h-[calc(100vh-64px)]">
  <!-- Mobile Sidebar Backdrop -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 lg:hidden animate-fade-in"
      (click)="toggleSidebar()"
    ></div>
  }

  <!-- Sidebar -->
  <aside
    class="admin-sidebar bg-base-200/95 backdrop-blur-md border-r border-base-300/50 flex flex-col transition-all duration-300 ease-in-out shrink-0 overflow-hidden
           fixed inset-y-0 left-0 z-50 w-64 -translate-x-full
           lg:static lg:translate-x-0 lg:z-auto"
    [class.translate-x-0]="sidebarOpen()"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.lg:w-64]="sidebarDesktopOpen()"
    [class.lg:w-20]="!sidebarDesktopOpen()"
  >
    <!-- Logo -->
    <div class="p-4 flex items-center gap-3 border-b border-base-300/50">
      <img
        src="assets/logo-small.png"
        alt="Logo"
        routerLink="/"
        class="w-10 h-10 rounded-xl cursor-pointer hover:scale-105 transition-transform shrink-0"
        loading="lazy"
      />
      @if (sidebarOpen() || sidebarDesktopOpen()) {
        <span class="font-display font-bold text-lg text-base-content whitespace-nowrap animate-fade-in lg:block" [class.lg:hidden]="!sidebarDesktopOpen()">
          Admin
        </span>
      }
    </div>

    <!-- Navigation -->
    <nav class="flex-1 p-3 space-y-1">
      @for (nav of navigationRoutes; track nav.route) {
        <a
          [routerLink]="nav.route"
          routerLinkActive="admin-nav-active"
          class="admin-nav-item group flex items-center gap-3 px-3 py-2.5 rounded-xl text-base-content/70 hover:bg-base-300/50 hover:text-base-content transition-all duration-200"
          [class.lg:justify-center]="!sidebarDesktopOpen()"
          [title]="nav.title | transloco"
          (click)="closeSidebarOnMobile()"
        >
          @switch (nav.icon) {
            @case ('spots') {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0 group-hover:text-secondary transition-colors" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
              </svg>
            }
            @case ('pending') {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0 group-hover:text-secondary transition-colors" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
              </svg>
            }
            @case ('townships') {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0 group-hover:text-secondary transition-colors" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008Zm0 3h.008v.008h-.008v-.008Zm0 3h.008v.008h-.008v-.008Z" />
              </svg>
            }
          }
          <span class="text-sm font-medium whitespace-nowrap lg:block" [class.lg:hidden]="!sidebarDesktopOpen()">{{ nav.title | transloco }}</span>
        </a>
      }
    </nav>

    <!-- Bottom Actions -->
    <div class="p-3 border-t border-base-300/50 space-y-1">
      <button
        (click)="logout()"
        class="admin-nav-item group flex items-center gap-3 px-3 py-2.5 rounded-xl text-base-content/70 hover:bg-error/10 hover:text-error transition-all duration-200 w-full"
        [class.lg:justify-center]="!sidebarDesktopOpen()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1 0 12.728 0M12 3v9" />
        </svg>
        <span class="text-sm font-medium lg:block" [class.lg:hidden]="!sidebarDesktopOpen()">{{ 'logout' | transloco }}</span>
      </button>

      <button
        (click)="toggleDesktopSidebar()"
        class="hidden lg:flex items-center gap-3 px-3 py-2.5 rounded-xl text-base-content/50 hover:bg-base-300/50 hover:text-base-content transition-all duration-200 w-full"
        [class.justify-center]="!sidebarDesktopOpen()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0 transition-transform duration-300" [class.rotate-180]="!sidebarDesktopOpen()" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.75 19.5l-7.5-7.5 7.5-7.5m-6 15L5.25 12l7.5-7.5" />
        </svg>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto bg-base-100 w-full">
    <!-- Mobile Header Bar -->
    <div class="flex items-center gap-3 p-3 border-b border-base-300/30 lg:hidden">
      <button (click)="toggleSidebar()" class="btn btn-ghost btn-sm btn-square" aria-label="Open sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
      <span class="font-display font-semibold text-base">Admin</span>
    </div>

    <div class="p-4 sm:p-6 lg:p-8 max-w-6xl animate-fade-in">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
