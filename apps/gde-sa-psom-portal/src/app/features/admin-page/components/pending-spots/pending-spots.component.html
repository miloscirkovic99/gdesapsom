<div class="space-y-8">
  <!-- Spots Section -->
  <div class="card bg-base-200/50 shadow-sm border border-base-300/30">
    <div class="card-body">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-warning/15 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-warning" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
        </div>
        <h2 class="font-display text-xl font-bold">Spots</h2>
      </div>
      <app-card
        [data]="pendingSpots()"
        [isPendingSpot]="true"
        [isAdmin]="true"
        [isLoading]="false"
        (onActionClick)="onAction($event,'spot')"
      ></app-card>
    </div>
  </div>

  <!-- Parks Section -->
  <div class="card bg-base-200/50 shadow-sm border border-base-300/30">
    <div class="card-body">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-success/15 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-success" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0 0 12 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75Z" />
          </svg>
        </div>
        <h2 class="font-display text-xl font-bold">Parks</h2>
      </div>
      <app-card
        [data]="parksStore.pendingParks()"
        [isPendingSpot]="true"
        [isAdmin]="true"
        [isLoading]="false"
        (onActionClick)="onAction($event,'park')"
      ></app-card>
    </div>
  </div>
</div>
