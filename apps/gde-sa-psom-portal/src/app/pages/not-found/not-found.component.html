<section class="max-w-2xl mx-auto py-16 sm:py-24 px-4 text-center space-y-6">
  <p class="font-display text-6xl sm:text-7xl font-bold text-secondary/80" aria-hidden="true">404</p>
  <h1 class="font-display text-2xl sm:text-3xl font-bold leading-tight">{{ titleKey() | transloco }}</h1>
  <p class="text-base-content/70">{{ textKey() | transloco }}</p>

  <form role="search" class="flex gap-2 max-w-md mx-auto" (ngSubmit)="search()">
    <label for="not-found-search" class="sr-only">{{ 'search_name' | transloco }}</label>
    <input
      id="not-found-search"
      type="search"
      [formControl]="query"
      class="input input-bordered flex-1"
      autocomplete="off"
      [placeholder]="'search_name' | transloco"
    />
    <button type="submit" class="btn btn-secondary">{{ 'search' | transloco }}</button>
  </form>

  <nav [attr.aria-label]="'not_found_browse' | transloco" class="flex flex-wrap justify-center gap-2 pt-2">
    <a routerLink="/" class="btn btn-sm btn-outline">{{ 'home' | transloco }}</a>
    @for (section of sections; track section.path) {
      <a [routerLink]="['/', section.path]" class="btn btn-sm btn-outline">{{ section.labelKey | transloco }}</a>
    }
  </nav>
</section>
