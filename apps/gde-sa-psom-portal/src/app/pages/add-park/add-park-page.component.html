<div class="max-w-2xl mx-auto py-6 sm:py-10 px-4">
  <h1 class="font-display text-2xl sm:text-3xl font-bold mb-6 sm:mb-8">{{ 'add_park' | transloco }}</h1>

  <form [formGroup]="parkForm" class="space-y-5 sm:space-y-6">
    @if (parkForm.invalid && parkForm.touched) {
      <div class="alert alert-error text-sm">{{ 'required' | transloco }}</div>
    }

    <!-- Name -->
    <label class="form-control w-full">
      <div class="label"><span class="label-text font-medium">{{ 'spot_name' | transloco }}</span></div>
      <input formControlName="par_ime" type="text" [placeholder]="'spot_name' | transloco"
        class="input input-bordered w-full"
        [class.input-error]="parkForm.get('par_ime')?.invalid && parkForm.get('par_ime')?.touched" />
    </label>

    <!-- Address / Location -->
    <label class="form-control w-full">
      <div class="label"><span class="label-text font-medium">{{ 'address' | transloco }}</span></div>
      <input formControlName="par_lokacija" type="text" [placeholder]="'address' | transloco"
        class="input input-bordered w-full"
        [class.input-error]="parkForm.get('par_lokacija')?.invalid && parkForm.get('par_lokacija')?.touched" />
    </label>

    <!-- Description -->
    <label class="form-control w-full">
      <div class="label"><span class="label-text font-medium">{{ 'short_description' | transloco }}</span></div>
      <textarea formControlName="par_opis" [placeholder]="'short_description' | transloco"
        class="textarea textarea-bordered w-full" rows="4"></textarea>
    </label>

    <!-- Township Select -->
    <mat-form-field class="w-full">
      <mat-label>{{ 'select_city' | transloco }}</mat-label>
      <mat-select formControlName="ops_id" #multiSelect>
        <mat-option>
          <ngx-mat-select-search
            [placeholderLabel]="'search' | transloco"
            [formControl]="townshipMultiFilterCtrl">
            <svg ngxMatSelectSearchClear xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke-width="1.5" stroke="currentColor" class="w-5 h-5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
            <span ngxMatSelectNoEntriesFound>{{ 'no_entries' | transloco }}</span>
          </ngx-mat-select-search>
        </mat-option>
        @for (township of filteredtownshipsMulti | async; track $index) {
          <mat-option [value]="township?.id">{{ township.ime }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Actions -->
    <div class="flex flex-col-reverse sm:flex-row gap-3 sm:gap-4 pt-4">
      <button type="button" (click)="onCancel()" class="btn btn-ghost w-full sm:w-auto">{{ 'close' | transloco }}</button>
      <button type="button" (click)="onSave()" [disabled]="parkForm.invalid" class="btn btn-secondary w-full sm:w-auto">
        {{ 'save' | transloco }}
      </button>
    </div>
  </form>
</div>
