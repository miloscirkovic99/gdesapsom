    <!--
      Only tags search engines read (no keywords, revisit-after or name="title").
      SeoService rewrites the title, description and robots tag per route; the
      description carries no counts because a hardcoded number goes stale.
    -->
    <meta
      name="description"
      content="Pronađite gde su psi dobrodošli u Srbiji! Pretražite pet-friendly restorane, kafiće, hotele, parkove za pse i veterinarske klinike u Beogradu, Novom Sadu, Nišu i širom Srbije."
    />
    <meta name="author" content="Gde sa psom" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="language" content="Serbian" />
    <meta name="application-name" content="Gde sa psom" />
    <meta name="geo.region" content="RS" />
    <meta name="geo.placename" content="Serbia" />
    <!--
      No canonical or hreflang here on purpose.
      A hardcoded canonical would tell Google that every route - /blog/<slug>,
      /spots/<id> - is really the homepage, so none of them would be indexed.
      SeoService (core/services/seo.service.ts) injects a per-route canonical on
      every navigation; until it runs, no canonical means each URL
      self-canonicalises, which is the correct default.
      hreflang is gone because Transloco switches language in place: there is one
      URL per page, so there is no alternate language URL to point at.
    -->
    <!--
      Open Graph / Twitter. No og:url or twitter:url here on purpose: a hardcoded
      homepage URL told link-preview crawlers that /spots/21 or /blog/x "is" the
      homepage. SeoService sets both per route; a crawler that runs no JavaScript
      falls back to the request URL, which is right. The logo stays as the
      no-JavaScript fallback image.
    -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Gde sa psom - Pronađite Pet-Friendly Mesta u Srbiji"
    />
    <meta
      property="og:description"
      content="Pronađite gde su vaši ljubimci dobrodošli! Pet-friendly restorani, kafići, hoteli, parkovi za pse i veterinarske klinike u Beogradu, Novom Sadu i širom Srbije."
    />
    <meta
      property="og:image"
      content="https://www.gdesapsom.com/assets/logo-big.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="Gde sa psom" />
    <meta property="og:locale" content="sr_RS" />
    <meta property="og:locale:alternate" content="en_US" />
    
    <!-- Twitter Card Tags -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:title"
      content="Gde sa psom - Pet-Friendly Restorani, Kafići i Hoteli u Srbiji"
    />
    <meta
      property="twitter:description"
      content="Pronađite gde su psi i mačke dobrodošli. Pet-friendly restorani, kafići, hoteli, parkovi za pse i veterinarske klinike u Srbiji."
    />
    <meta

      content="https://www.gdesapsom.com/assets/logo-big.png"
    />
    <meta name="twitter:creator" content="@gdesapsom" />
    <meta name="twitter:site" content="@gdesapsom" />

    <!-- Schema Markup - WebSite with SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.gdesapsom.com/#website",
        "name": "Gde sa psom",
        "alternateName": "Gde Sa Psom - Pet Friendly Srbija",

        "description": "Pronađite pet-friendly restorane, kafiće, hotele, parkove za pse i veterinarske klinike u Srbiji",
        "inLanguage": ["sr", "en"],
        "publisher": { "@id": "https://www.gdesapsom.com/#org" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.gdesapsom.com/all-spots?word={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <!--
